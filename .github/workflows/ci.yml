name: Telegram Control Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore TelegramControlStudio.sln
      - name: Build
        run: dotnet build TelegramControlStudio.sln --configuration Release --no-restore --verbosity minimal
      - name: Test
        run: dotnet test TelegramControlStudio.sln --configuration Release --no-build --filter "FullyQualifiedName!=TelegramControlStudio.Tests.TdLibNativeRuntimeTests.LoadsVerifiedNativeLibraryAndExecutesSynchronousOptionRequest" --verbosity normal
      - name: Dependency vulnerability scan
        run: dotnet list TelegramControlStudio.sln package --vulnerable --include-transitive --format json
      - name: Gitleaks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '8.30.1'
          $archive = Join-Path $env:RUNNER_TEMP "gitleaks_$version.zip"
          $extract = Join-Path $env:RUNNER_TEMP "gitleaks_$version"
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_windows_x64.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          & (Join-Path $extract 'gitleaks.exe') detect --source . --redact --no-banner