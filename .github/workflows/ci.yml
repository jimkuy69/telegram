name: Telegram Control Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-security:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore TelegramControlStudio.sln
      - name: Build
        run: dotnet build TelegramControlStudio.sln --configuration Release --no-restore --verbosity minimal
      - name: Test
        run: dotnet test TelegramControlStudio.sln --configuration Release --no-build --verbosity normal
      - name: Dependency vulnerability scan
        run: dotnet list TelegramControlStudio.sln package --vulnerable --include-transitive --format json
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
