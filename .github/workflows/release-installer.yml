name: Windows installer release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TelegramControlStudio.sln

      - name: Publish Windows x64
        run: dotnet publish src/TelegramControlStudio.App/TelegramControlStudio.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/win-x64 --no-restore

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw "ISCC.exe was not found at $iscc" }
          & $iscc installer/TelegramControlStudio.iss

      - name: Hash installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem artifacts/installer/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer output was not created.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$($installer.FullName).sha256" -Value "$hash  $($installer.Name)" -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: TelegramControlStudio-installer-${{ github.ref_name }}
          path: artifacts/installer/*

